name: Check and publish Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: Check Windows installer syntax and isolated share behavior
        shell: pwsh
        run: ./tests/installers.ps1
      - name: Use official Ubuntu HTTPS mirrors for browser dependencies
        run: |
          # Hosted runners can resolve Ubuntu sources through this mirror list.
          # Rewriting only ubuntu.sources leaves the slow HTTP mirror active.
          for ubuntu_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$ubuntu_source_file" ]; then
              sudo sed -i -E 's|http://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$ubuntu_source_file"
            fi
          done
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, local-installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publish download and installation guide
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  local-installers:
    name: Desktop installer (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset: Mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset: Mac
          - runner: windows-2025
            platform: win32
            arch: x64
            asset: Windows
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            asset: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix offline/tooling
      - run: npm run build:installer
      - run: npm run verify:installer
      - run: node offline/verify-ui.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-install/TrioBridge-AI-${{ matrix.asset }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
